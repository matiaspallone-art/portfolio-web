<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matías Pallone — Fotógrafo, director creativo y diseñador web</title>
<meta name="description" content="Portfolio de Matías Pallone: fotografía de moda, dirección creativa, branding y diseño web. Buenos Aires.">
<meta property="og:title" content="Matías Pallone">
<meta property="og:description" content="Fotógrafo de moda, director creativo y diseñador web. / Fashion photographer, creative director and web designer.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&amp;family=Cormorant+Garamond:wght@300&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <a class="brand" href="#inicio">M. Pallone</a>
  <nav aria-label="Principal">
    <ul>
      <li><a href="#fotografia" data-i18n="nav_fotografia">Fotografía</a></li>
      <li><a href="#web" data-i18n="nav_web">Web</a></li>
      <li><a href="#arte" data-i18n="nav_arte">Arte</a></li>
      <li><a href="#servicios" data-i18n="nav_servicios">Servicios</a></li>
      <li><a href="#contacto" data-i18n="nav_contacto">Contacto</a></li>
      <li>
        <div class="lang" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="es" aria-pressed="true" lang="es" aria-label="Español">ES</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
        </div>
      </li>
    </ul>
  </nav>
</header>

<main>
  <section class="hero" id="inicio">
    <div class="hero-note" data-i18n="hero_note"></div>
    <div class="hero-content">
      <h1 id="nombre"></h1>
      <p class="sub" data-i18n="subtitulo"></p>
    </div>
  </section>

  <section class="intro"><p data-i18n="frase"></p></section>

  <section class="section" id="fotografia" style="padding-top:40px">
    <div class="section-head">
      <h2 class="section-title" data-i18n="fotografia_title"></h2>
      <span class="eyebrow" data-i18n="fotografia_status"></span>
    </div>
    <div class="photos" id="fotos"></div>
    <div class="photos-foot">
      <a class="link-line" id="fotos-link" href="#" target="_blank" rel="noopener" data-i18n="fotos_link" hidden></a>
      <span class="domain" id="fotos-dominio" hidden></span>
    </div>
  </section>

  <section class="section web" id="web">
    <div class="section-head">
      <h2 class="section-title" data-i18n="web_title"></h2>
      <span class="eyebrow" data-i18n="web_sub"></span>
    </div>
    <div id="proyectos"></div>
  </section>

  <section class="section" id="arte">
    <div class="section-head" style="margin-bottom:24px">
      <h2 class="section-title" id="arte-nombre"></h2>
      <span class="eyebrow" id="arte-etiqueta"></span>
    </div>
    <p class="art-lead" id="arte-desc"></p>
    <div class="art-cover" id="arte-portada" hidden></div>
    <p class="art-link" id="arte-link-wrap" hidden><a class="link-line" id="arte-link" href="#" target="_blank" rel="noopener"></a></p>
    <div class="art-grid" id="obras"></div>
  </section>

  <section class="section services" id="servicios">
    <h2 class="section-title" data-i18n="servicios_title"></h2>
    <div class="services-grid">
      <div class="service" data-i18n="s1"></div>
      <div class="service" data-i18n="s2"></div>
      <div class="service" data-i18n="s3"></div>
      <div class="service" data-i18n="s4"></div>
      <div class="service" data-i18n="s5"></div>
      <div class="service"><span data-i18n="s6"></span><small data-i18n="s6_small"></small></div>
    </div>
  </section>

  <section class="section about" id="sobre-mi">
    <div class="tile" data-i18n="tile_retrato"></div>
    <div class="about-text">
      <h2 class="section-title" data-i18n="about_title"></h2>
      <p class="lead" data-i18n="about_lead"></p>
      <p class="body" data-i18n="about_body"></p>
    </div>
  </section>
</main>

<footer class="contact" id="contacto">
  <p class="eyebrow" data-i18n="contact_eyebrow"></p>
  <p class="big" data-i18n="contact_big"></p>
  <p class="email" id="email" hidden></p>
  <div class="social" id="social"></div>
  <p class="copy">© <span id="anio"></span> Matías Pallone · Buenos Aires</p>
  <p class="copy legal" data-i18n="legal"></p>
</footer>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
